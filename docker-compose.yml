# Local development services. Requires Docker with a Linux container engine.
# Without Docker, use scripts/dev-db.sh (see README and ADR-0017).
#
# Copy .env.example to .env to override the development-only defaults below.
name: idme

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IDME_DB_SUPERUSER_PASSWORD:-postgres_dev_only}
      IDME_DB_OWNER_PASSWORD: ${IDME_DB_OWNER_PASSWORD:-idme_owner_dev}
      IDME_DB_APP_PASSWORD: ${IDME_DB_APP_PASSWORD:-idme_app_dev}
    ports:
      - "127.0.0.1:${IDME_DB_PORT:-55432}:5432"
    volumes:
      - idme-pgdata:/var/lib/postgresql
      - ./scripts/db/init.sql:/idme-sql/init.sql:ro
      - ./scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/10-idme-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  idme-pgdata:
